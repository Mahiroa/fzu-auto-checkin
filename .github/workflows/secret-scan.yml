name: secret-scan

# 历史里被塞进过一次真实 token（2026-11-16，oss.fzu.edu.cn 的 Access-Token），
# 所以这里扫**全历史**而不是只看 diff：已经进过库的东西，只有全量扫才可能被后续发现。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 全历史扫描必须拿全量提交

      # 直接下二进制而不用 marketplace action：无需 license，版本可控。
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full history
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --verbose \
            --exit-code 1
