name: secret-scan

# 历史里被塞进过一次真实 token（2026-11-16，oss.fzu.edu.cn 的 Access-Token），
# 所以这里扫**全历史**而不是只看 diff：已经进过库的东西，只有全量扫才可能被后续发现。
#
# 工具用 betterleaks（gitleaks 原作者的新项目）。规则与豁免在仓库根的 betterleaks.toml，
# 与本地 pre-commit 钩子共用同一份配置，避免"本地绿、CI 红"。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 全历史扫描必须拿全量提交

      # 直接下二进制而不用 marketplace action：无需 license，版本可控，
      # 并且按官方 checksums.txt 里的 sha256 校验（只核对版本号挡不住被替换的包）。
      - name: Install betterleaks
        env:
          BETTERLEAKS_VERSION: 2.0.0-rc.8
          BETTERLEAKS_SHA256: 323a6476ffe06a52fc6bc1c293eb98e3f17d2bfb0110f08feedd38ea3b00e38f
        run: |
          set -euo pipefail
          base="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}"
          curl -sSfL "$base/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/betterleaks.tgz
          echo "${BETTERLEAKS_SHA256}  /tmp/betterleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/betterleaks.tgz -C /usr/local/bin betterleaks
          betterleaks version

      # 资源全开：历史补丁 + 合并提交 + 提交信息 + notes + tag 信息。
      # 只扫 history 会漏掉"密钥写在提交信息里"这种真实场景。
      - name: Scan full history
        run: |
          betterleaks git . \
            --config betterleaks.toml \
            --include=history,merges,commit-messages,notes,tag-messages \
            --redact \
            --exit-code 1
