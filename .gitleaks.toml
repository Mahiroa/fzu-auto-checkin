# gitleaks 配置：在默认规则集之上，补两类本项目踩过的坑。
#
# 背景（2026-11-16）：真实的 oss.fzu.edu.cn Access-Token（22 字符、无前缀 base64url）
# 曾被当成测试夹具写进三个 *_test.go。默认规则集只认 ghp_/AKIA/SCT 这类带前缀的值，
# 抓不到纯随机串，所以在下面加了一条"高熵 token 字面量"规则。
#
# 原则：不把任何真实值写进本文件（否则等于把秘密又提交一次）。豁免只豁免"形状"：
# SYNTHETIC 前缀、明显的合成标记（fake/stale/preset/0123456789…）。
#
# 阈值依据：真实值 aAvk… 的 Shannon 熵 = 4.005；英文短语型噪声
# （wrong-from-other-ip 3.34、definitely-not-the-password 3.86）都低于 3.9，
# 所以取 3.9 能放过短语、留住真随机串。合成夹具里熵更高的那几个靠 allowlist 排除。

title = "fzu-auto-checkin secret scan"

[extend]
useDefault = true

# ---------------------------------------------------------------- 自定义规则

[[rules]]
id = "opaque-token-literal"
description = "疑似真实 token 的字面量（无前缀、≥20 字符、高熵）"
regex = '''(?i)(?:token|cookie|session|secret|passwd|password|api[_-]?key|access[_-]?key|send[_-]?key)\b[^\n]{0,16}?["']([A-Za-z0-9_\-+/=]{20,})["']'''
secretGroup = 1
entropy = 3.9
keywords = ["token", "cookie", "session", "secret", "password", "key"]

[[rules]]
id = "session-cookie-literal"
description = "疑似真实 SESSION Cookie 的值（24 字符以上）"
regex = '''(?i)\bSESSION=([A-Za-z0-9._\-]{24,})'''
secretGroup = 1
entropy = 3.5
keywords = ["SESSION="]

# ---------------------------------------------------------------- 全局豁免
# 只放行"合成形状"，不放行任何路径整体盲扫（_test.go 恰恰是最需要扫的地方）。

[allowlist]
description = "合成夹具 / 占位符 / 二进制文档"
regexTarget = "secret"
paths = [
  '''docs/verify-shots/''',
  '''\.recon/''',
]
regexes = [
  # 显式合成标记
  '''SYNTHETIC[_-][A-Za-z0-9_-]*''',
  '''(?i)should-not-leak''',
  '''(?i)(fake|stale|preset|dummy|placeholder|hunter2)''',
  # 测试里惯用的占位序列
  '''0123456789''',
  '''(?i)abcdefghij''',
  '''(?i)^abc123''',
  # 推送渠道的假 key
  '''(?i)^sct(123456|secret)''',
  '''(?i)wecomsecret''',
  '''(?i)sctsecretkey''',
  # 假 SESSION 值
  '''(?i)(aaaa-bbbb|1111-2222|good-session|typed-just-now|static-session|google-session)''',
  '''(?i)xxxx''',
  # 文档占位
  '''(?i)your[-_]?(token|key|domain)''',
]
