# 智汇福大晚点名自动签到 - 配置模板
# 复制本文件为 config.yaml 并填写真实值（config.yaml 已被 .gitignore 忽略，勿提交仓库）
#
# 关于时刻：一律写成带引号的字符串，如 "21:35"。
#   不加引号时 YAML 会按 60 进制整数解析（21:35 → 1295，21:00 → 1260），
#   src/config.py 会尽量还原并给出警告，但带引号最省事、不会看错。

user:
  # 晚点名 H5 免登 token（获取方式见 docs/protocol.md 的「获取 token」一节）
  # 注意：token 有有效期，失效后需重新获取（脚本会明确报错提示）
  token: ""

  # 以下两项为可选：CAS 自动登录（已实现，token 为空时自动用学号密码换新 token 并回写 config.yaml）
  # 填【当前能成功登录智汇福大 App 的账号密码】：
  #   username = 学号
  #   password = 你现在登录智汇福大 App 用的密码
  #             （如果你在 App 内自己改过密码，就填改过之后的那个，
  #              不保证与学校统一身份认证初始密码一致）
  # 配了 token 就不用填这两项
  username: ""          # 学号（登录智汇福大 App 用的）
  password: ""          # 当前登录智汇福大 App 的密码

# 晚点名签到位置（高德 GCJ-02 坐标系，填你在校区内常驻位置的真实坐标）
# 获取方法：打开高德坐标拾取器 https://lbs.amap.com/tools/picker
#           搜索/点选你的宿舍楼 → 复制"经度,纬度"分别填入下面两行
checkin:
  # ===== 单点位置（旧配置，继续可用）=====
  # 与下面的 locations 互斥：locations 非空时只认池子，这三行会被忽略。
  longitude: ""         # 经度，如 119.20463
  latitude: ""          # 纬度，如 26.04920
  actual_location: ""   # 打卡上报的地址文案，如 "福州大学旗山校区生活区X号楼"

  # ===== 可选：多位置池 =====
  # locations 与上面的单点互斥：列表非空时只认池子（按 weight 加权随机挑一个点），
  # 上面的 longitude / latitude / actual_location 全部不生效 —— locations 优先。
  # 只想用单点就保持下面这行 locations: []（或整段删掉），最省事。
  # 每项都要有 longitude / latitude（纯数字，建议加引号）；actual_location 绑定该点的上报文案；
  # weight 可选（默认 1，0/负数按 1 处理）—— 让"常住的宿舍楼"比"偶尔去的教学楼"更容易被抽中。
  #
  # 要用位置池：把下面这行 `locations: []` 整行删掉，换成紧随其后的示例（去掉每行开头的 #）。
  # 注意：同一份 YAML 里出现两个 locations 键时后出现的生效，两行都留会以为池子没配成功。
  locations: []
  # 示例（拿它替换掉上面那行 locations: []）：
  #   locations:
  #     - longitude: "119.20463"
  #       latitude: "26.04920"
  #       actual_location: "福州大学旗山校区生活区X号楼"
  #       weight: 3
  #     - longitude: "119.20510"
  #       latitude: "26.04880"
  #       actual_location: "福州大学旗山校区教学楼"

  # ===== 位置抖动 =====
  # 以选中坐标（单点，或位置池里抽到的那个点）为圆心、本值为半径的圆内随机取一点上报，
  # 避免每晚上报完全相同的坐标（更像真实设备定位漂移）。
  # 单位：米。填 0 关闭抖动，按配置坐标原样上报；填错/留空/写负数按默认 200 米
  # （负数当笔误处理而不是当"关闭"，否则一个手滑的负号会静默去掉抖动）。
  jitter_radius_m: 200

  # 新键：位置抖动半径（米）。**非空时优先于 jitter_radius_m**，两个键不会叠加：
  #   location_jitter_m 有值 → 用它；location_jitter_m 留空 "" → 回落到 jitter_radius_m。
  # 迁移期间想直接改半径，就填这里（推荐），旧的 jitter_radius_m 留着不碍事。
  location_jitter_m: ""

  # ===== 时间调度 =====
  # 整段可以不写：缺省等价于下面这套值，行为与改造前一致（21:35 签，窗口 21:00-23:59）。
  #
  # ⚠ GitHub Actions 的 cron 必须覆盖 times 所在的时段，否则那些时刻根本不会被触发：
  #   脚本只能"被叫醒之后决定做什么"，不能自己创造运行机会。
  #   仓库自带的 .github/workflows/checkin.yml 用 `*/10 13-15 * * *`（UTC 13:00-15:59
  #   = 北京 21:00-23:59）每 10 分钟扫一次，覆盖整个默认窗口；
  #   若把自己的 times / 窗口挪到这段之外（例如 20:30 或次日 00:20），必须同步增加对应 cron。
  schedule:
    window_start: "21:00"      # 可行签到窗口起点（含）
    window_end: "23:59"        # 可行签到窗口终点（含，按 23:59:59 收尾；不支持跨日窗口）

    # 自定义签到时刻，HH:MM 或 HH:MM:SS，可以写任意多个（务必带引号）；
    # 留空或删掉该项 = ["21:35"]。被 cron 提前叫醒时脚本会等到最近的目标时刻。
    times: ["21:35", "21:50"]

    # 时间抖动 ±N 分钟，0 = 关闭。
    # 抖动后会被二次校验钳制回窗口：抽到的时刻越出 window_start / window_end 时先重抽（最多 8 次），
    # 仍越界就钳制到 21:00 后 / 23:59 前，并在真正执行前再用 in_window 校验一次 ——
    # 因此不论抖动设多大，最终都不会在 21:00-23:59 之外打卡。
    time_jitter_minutes: 0

    max_wait_minutes: 12       # 早到时最多等多少分钟；超过就放弃本次，等下一个 cron 再来
    tolerance_minutes: 5       # 迟到容忍：now - target <= 该值视为准点（否则记为迟到但仍签）

# 假期自动跳过：日期区间内脚本不执行任何操作（不签、不推、不留记录）
# 区间依据《福州大学 2026—2027 学年校历》（福大教〔2026〕10号）：
#   第一学期 2026-08-31 ~ 2027-01-22；寒假 2027-01-23 ~ 2027-02-21
#   第二学期 2027-02-22 ~ 2027-07-02；暑假 2027-07-03 ~ 2027-08-29
# 新学年校历发布后请自行更新；也可添加个人区间（如实训、离校期间）
vacation:
  notify: false        # 命中假期时是否推送提醒（默认静默跳过，避免假期刷屏）
  skip_ranges:
    - name: 寒假
      start: "2027-01-23"
      end: "2027-02-21"
    - name: 暑假
      start: "2027-07-03"
      end: "2027-08-29"

# 推送通道：填一种即可，其余留空
notify:
  type: "serverchan"    # serverchan | pushplus | bark | wecom | none
  serverchan_key: ""    # Server酱 Turbo SendKey
  pushplus_token: ""    # PushPlus token
  bark_url: ""          # Bark 推送完整 URL
  wecom_webhook: ""     # 企业微信群机器人 webhook
